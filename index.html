  function setLang(lang) {
    if (!STRINGS[lang]) lang = "ko";
    var dict = STRINGS[lang];

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (dict[key] !== undefined) el.innerHTML = dict[key];
    });
    document.querySelectorAll("[data-i18n-attr]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-attr");
      if (dict[key] !== undefined) el.setAttribute("alt", dict[key]);
    });

    document.title = dict.title;
    var descMeta = document.querySelector('meta[name="description"]');
    if (descMeta) descMeta.setAttribute("content", dict.description);
    document.documentElement.setAttribute("lang", lang);

    document.getElementById("lang-btn-ko").classList.toggle("active", lang === "ko");
    document.getElementById("lang-btn-en").classList.toggle("active", lang === "en");

    try { localStorage.setItem("ds5connect-lang", lang); } catch (e) {}

    // Keep the embedded giscus comment widget's own UI language in sync
    // (it renders in its own cross-origin iframe, so this has to go
    // through postMessage rather than touching its DOM directly).
    var giscusFrame = document.querySelector("iframe.giscus-frame");
    if (giscusFrame) {
      giscusFrame.contentWindow.postMessage(
        { giscus: { setConfig: { lang: lang } } },
        "https://giscus.app"
      );
    }
  }

  function initialLang() {
    try {
      var stored = localStorage.getItem("ds5connect-lang");
      if (stored) return stored;
    } catch (e) {}
    return navigator.language && navigator.language.toLowerCase().indexOf("ko") === 0 ? "ko" : "en";
  }

  setLang(initialLang());

  // Points the download button at this repo's latest GitHub Release .dmg
  // asset, and shows the tag as the version, without hardcoding a version
  // number that would go stale. Runs after setLang so it overwrites the
  // placeholder download-meta text with real version/size info.
  (function () {
    var owner = "parktaeyang";
    var repo = "ds5-connect-releases";
    fetch("https://api.github.com/repos/" + owner + "/" + repo + "/releases/latest")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var asset = (data.assets || []).find(function (a) {
          return /\.dmg$/i.test(a.name);
        });
        if (asset) {
          document.getElementById("download-link").href = asset.browser_download_url;
